[project]
name = "student-success-assistant"
version = "6.0.0"
description = "OULAD early-warning, hybrid historical-case retrieval and multi-agent student-support system"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E702"]

[tool.coverage.run]
source = ["ssa"]
omit = ["ssa/reporting.py"]  # renders documents from finished artifacts; exercised by `ssa.cli report`, not unit tests

[tool.coverage.report]
skip_empty = true
show_missing = false
