# 1. Put the 7 OULAD CSVs in ./data/raw and create .env from .env.example (set STUDENT_ASSISTANT_API_KEY)
# 2. docker compose run --rm build       # features, models, indexes for every checkpoint, evaluation, quality gate
# 3. docker compose up app                # API + console on http://localhost:8000
x-common: &common
  build: { context: . }
  env_file: [.env]
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
services:
  build:
    <<: *common
    profiles: ["build"]
    command: ["python", "-m", "ssa.cli", "build"]
  app:
    <<: *common
    ports: ["8000:8000"]
    restart: unless-stopped
